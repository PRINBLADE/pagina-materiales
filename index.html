<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitud de Materiales</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="pantalla-login" class="login-container">

        <h1>🤖 Solicitud de Materiales</h1>

        <p>Ingresa tus datos para acceder al sistema.</p>

        <div class="login-box">

            <label for="usuario">Usuario</label>
            <input type="number" id="usuario" placeholder="Ejemplo: 1">

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" placeholder="Ejemplo: 1">

            <button onclick="iniciarSesion()">
                INGRESAR
            </button>

            <p id="mensaje"></p>

        </div>

    </div>


    <!-- PANTALLA PRINCIPAL -->
    <div id="pantalla-principal" style="display: none;">

        <header>

            <h1>🤖 Sistema de Solicitud de Materiales</h1>

            <div class="usuario-menu">

                👤 <span id="nombre-profesor"></span>

                <button onclick="verCarrito()">
                    🛒 Mi carrito (<span id="contador-carrito">0</span>)
                </button>

                <button onclick="cerrarSesion()">
                    Cerrar sesión
                </button>

            </div>

        </header>


        <main>

            <h2>📦 Catálogo de materiales</h2>

            <p>
                Aquí aparecerán los materiales disponibles para solicitar.
            </p>

            <div id="catalogo">

                <p>Próximamente veremos aquí los materiales.</p>

            </div>

        </main>

    </div>

<!-- PANTALLA DEL CARRITO -->
<div id="pantalla-carrito" style="display: none;">

    <header>

        <h1>🛒 Mi carrito</h1>

        <button onclick="volverCatalogo()">
            ← Volver al catálogo
        </button>

    </header>

    <main>

        <h2>Materiales seleccionados</h2>

        <div id="contenido-carrito">

            <!-- JavaScript mostrará aquí los materiales -->

        </div>

    </main>

</div>
    <script src="script.js"></script>

</body>

</html>
